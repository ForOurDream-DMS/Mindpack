name: Bug report
description: Report a reproducible problem in Mindpack
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not paste real private conversations, credentials, customer data, or local secrets into public issues.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: "Example: validate reports VALID even when ..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal public-safe reproduction.
      placeholder: |
        1. Run `python3 -m mindpack_kit ...`
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "What should Mindpack do instead?"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / output
      description: Paste only public-safe output. Redact private paths and values.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Mindpack version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: false
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options:
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "Other"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed or redacted private conversations, secrets, local absolute paths, and customer data.
          required: true
