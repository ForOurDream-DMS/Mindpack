[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mindpack-kit"
version = "0.1.0"
description = "Local CLI for compiling Markdown LLM Wikis into portable Mindpacks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mindpack contributors" }]

[project.scripts]
mindpack-kit = "mindpack_kit.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
